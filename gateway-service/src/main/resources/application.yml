server:
  port: 8080

spring:
  application:
    name: gateway-service
  config:
    import: optional:configserver:${CONFIG_URL:http://localhost:8888}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/bank}
          jwk-set-uri: ${KEYCLOAK_JWKS:http://localhost:8180/realms/bank/protocol/openid-connect/certs}
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
                allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
                allowed-headers: "*"
          routes:
            - id: account-rest
              uri: lb://account-service
              predicates:
                - Path=/api/accounts/**
            - id: account-graphql
              uri: lb://account-service
              predicates:
                - Path=/accounts/graphql
              filters:
                - SetPath=/graphql
            - id: transaction-rest
              uri: lb://transaction-service
              predicates:
                - Path=/api/transactions/**,/api/transfers/**
            - id: transaction-graphql
              uri: lb://transaction-service
              predicates:
                - Path=/transactions/graphql
              filters:
                - SetPath=/graphql
            - id: assistant
              uri: lb://assistant-service
              predicates:
                - Path=/api/assistant/**
