server:
  port: 8888

spring:
  application:
    name: config-service
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          # CONFIG_REPO permet de monter un dossier externe pour tester /actuator/refresh
          search-locations: ${CONFIG_REPO:classpath:/config-repo}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
