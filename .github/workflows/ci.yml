name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compilation
        run: mvn -B -ntp compile
      - name: Tests
        run: mvn -B -ntp verify
      - uses: actions/upload-artifact@v5
        with:
          name: jars
          path: "*/target/*.jar"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Compilation du client Angular
        working-directory: bank-web
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v5
        with:
          name: web
          path: bank-web/dist

  fraud-detection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Exécution du script
        run: |
          pip install -r fraud-detection/requirements.txt
          python fraud-detection/fraud_detection.py

  images:
    if: github.event_name == 'push'
    needs: [build-test, web, fraud-detection]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - discovery-service
          - config-service
          - gateway-service
          - account-service
          - transaction-service
          - transaction-consumer-service
          - assistant-service
          - bank-web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: jars
      - uses: actions/download-artifact@v5
        with:
          name: web
          path: bank-web/dist
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construction et publication de l'image
        run: |
          image="${REGISTRY}/${{ matrix.service }}:${{ github.sha }}"
          docker build -t "$image" "${{ matrix.service }}"
          docker push "$image"

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Étape schématique : le sujet ne demande aucun déploiement réel
      - name: Déploiement
        run: |
          echo "Déploiement de l'image ${GITHUB_SHA} : docker compose pull && docker compose up -d --wait"
          echo "En cas d'échec des contrôles de santé, redéployer le SHA précédent"
