server:
  port: 8081

spring:
  application:
    name: account-service
  config:
    import: optional:configserver:${CONFIG_URL:http://localhost:8888}
  datasource:
    url: ${DB_URL:jdbc:h2:mem:accounts;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/bank}
          jwk-set-uri: ${KEYCLOAK_JWKS:http://localhost:8180/realms/bank/protocol/openid-connect/certs}
  ai:
    mcp:
      server:
        name: account-mcp
        version: 1.0.0
        protocol: STATELESS
        type: SYNC
